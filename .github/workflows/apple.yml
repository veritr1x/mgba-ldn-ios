name: Apple and Switch releases
on:
  push:
    branches: [ios-relay, 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  SWITCH_RELAY_REF: df0920e531c942c663119758016eaa9dea1a91dd
concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check source and release version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python3 src/platform/ios-ldn/tools/privacy_check.py
          if [ -n "$TAG" ]; then test "$TAG" = "v$(cat src/platform/ios-ldn/VERSION)"; fi
      - name: Install build tools
        run: |
          command -v cmake || brew install cmake
          command -v ninja || brew install ninja
          command -v node || brew install node
      - name: Build iOS app for sideloading
        run: python3 src/platform/ios-ldn/build.py --platform ios
      - name: Test game protocol, notification recovery and saves
        run: |
          python3 src/platform/ios-ldn/tools/test_lab.py
          python3 src/platform/ios-ldn/tools/test_notification.py
          python3 src/platform/ios-ldn/tools/test_game_files.py
          python3 src/platform/ios-ldn/tools/test_player.py
          python3 src/platform/ios-ldn/tools/test_gifts.py
          python3 -m unittest discover -s src/platform/ios-ldn/tools -p 'test_*checks.py'
      - name: Build Mac app
        run: python3 src/platform/ios-ldn/build.py --platform mac --skip-core
      - name: Validate and package downloads
        run: python3 src/platform/ios-ldn/tools/package.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apple-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
  switch:
    name: Build matching Switch relay
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: veritr1x/ldn-relay
          ref: ${{ env.SWITCH_RELAY_REF }}
          path: build/relay-source
          persist-credentials: false
      - name: Test relay transport and release guards
        working-directory: build/relay-source
        run: |
          sudo apt-get update && sudo apt-get install -y libssl-dev
          python3 scripts/privacy_check.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
          make test ble-lab-test HOST_CC=clang
      - name: Build Switch NRO with pinned devkitPro toolchain
        working-directory: build/relay-source
        run: sh build.sh
      - name: Validate and package Switch download
        # The Apple and relay versions have independent tag sequences.
        env:
          GITHUB_REF: refs/heads/main
        run: |
          python3 build/relay-source/scripts/package.py
          python3 src/platform/ios-ldn/tools/package_switch.py build/relay-source/dist dist-switch
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: switch-release-${{ github.sha }}
          path: dist-switch/
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, switch]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          gh run download "$RUN_ID" --name "apple-release-$COMMIT" --dir dist
          gh run download "$RUN_ID" --name "switch-release-$COMMIT" --dir dist
          (cd dist && sha256sum *.ipa *.zip *.nro SOURCE-AND-LICENSES.txt SWITCH-RELAY-SOURCE.txt > SHA256SUMS.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --prerelease \
              --title "mGBA LDN $TAG for iOS and macOS" \
              --notes-file src/platform/ios-ldn/RELEASE.md
          fi
